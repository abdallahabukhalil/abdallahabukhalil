<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-labelledby="t d">
  <title id="t">Abdallah Abukhalil</title>
  <desc id="d">Data Analyst and Scientist. B.Sc in Stat and CS, Ain Shams University.</desc>
  <style>
    .rise { animation: rise 0.9s cubic-bezier(.2,.7,.2,1) backwards; }
    .fade { animation: fade 0.8s ease-out backwards; }
    .draw { transform-box: fill-box; transform-origin: center; animation: draw 0.8s cubic-bezier(.2,.7,.2,1) 0.6s backwards; }
    .w1 { animation: drift 9s linear infinite; }
    .w2 { animation: drift 14s linear infinite reverse; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes draw { from { transform: scaleX(0); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-600px); } }
    @media (prefers-reduced-motion: reduce) {
      .rise, .fade, .draw, .w1, .w2 { animation: none; }
    }
  </style>
  <defs>
    <clipPath id="card"><rect width="1200" height="280" rx="20"/></clipPath>
  </defs>
  <rect width="1200" height="280" rx="20" fill="#F3E7CF"/>
  <g clip-path="url(#card)">
    <g class="w2"><path transform="translate(-300,250)" d="M0 0 q150 -34 300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 V90 H0 Z" fill="#E3D0A6" opacity="0.75"/></g>
    <g class="w1"><path transform="translate(0,246)" d="M0 0 q150 -34 300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 V90 H0 Z" fill="#EAD9B6" opacity="0.9"/></g>
  </g>
  <rect x="1.5" y="1.5" width="1197" height="277" rx="18.5" fill="none" stroke="#D9C59B" stroke-width="3"/>
  <text class="rise" style="animation-delay:.1s" x="600" y="108" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="#2B2118">Abdallah Abukhalil</text>
  <line class="draw" x1="540" y1="136" x2="660" y2="136" stroke="#B8864B" stroke-width="3" stroke-linecap="round"/>
  <text class="fade" style="animation-delay:.9s" x="600" y="180" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" fill="#5A4631" letter-spacing="1">Data Analyst  ·  Data Scientist</text>
  <text class="fade" style="animation-delay:1.2s" x="600" y="220" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-style="italic" fill="#7A6247">B.Sc in Stat &amp; CS - Ain Shams University</text>
</svg>
